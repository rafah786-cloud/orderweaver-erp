name: WS0 Foundation — Local Supabase

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - "supabase/rollback/**"
      - "supabase/tests/**"
      - "security-tests/ws0_*"
      - "security-tests/run_ws0_local_supabase.sh"
      - ".github/workflows/ws0-foundation.yml"
      - "docs/BUILD_STATE.md"
  push:
    branches: ["feature/ws0-approval-audit-foundation"]
    paths:
      - "supabase/migrations/**"
      - "supabase/rollback/**"
      - "supabase/tests/**"
      - "security-tests/ws0_*"
      - "security-tests/run_ws0_local_supabase.sh"
      - ".github/workflows/ws0-foundation.yml"
      - "docs/BUILD_STATE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ws0-local-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-supabase-migrations-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python3 --version
          supabase --version
          docker --version

      - name: Replay baseline, apply WS0, and run adversarial tests
        shell: bash
        run: bash security-tests/run_ws0_local_supabase.sh

      - name: Upload replay logs, migration ledgers, schema snapshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws0-local-supabase-${{ github.run_id }}
          path: artifacts/ws0/**
          if-no-files-found: warn
          retention-days: 14
