name: Accounting migration replay — disposable Supabase

on:
  push:
    branches: ["fix/bill-allocations-migration-replay"]
    paths:
      - "supabase/migrations/**"
      - "security-tests/accounting_migration_integrity.sql"
      - "security-tests/replay_accounting_migrations.sh"
      - ".github/workflows/accounting-migration-replay.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - "security-tests/accounting_migration_integrity.sql"
      - "security-tests/replay_accounting_migrations.sh"
      - ".github/workflows/accounting-migration-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-migration-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          supabase --version
          docker --version
          psql --version

      - name: Replay full migration chain and assert accounting boundaries
        shell: bash
        run: bash security-tests/replay_accounting_migrations.sh

      - name: Upload migration ledger, schema and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-migration-replay-${{ github.run_id }}
          path: artifacts/accounting-replay/**
          if-no-files-found: warn
          retention-days: 14
