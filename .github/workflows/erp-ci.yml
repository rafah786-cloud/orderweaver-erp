name: ERP CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

  tally-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tally-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
