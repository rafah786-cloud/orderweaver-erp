name: One-off format repair

on:
  push:
    branches:
      - feat/direct-tally-migration-engine

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/_app.inventory.journals.tsx tally-bridge/src/index.ts tally-bridge/src/snapshot.ts tally-bridge/src/tally-client.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_app.inventory.journals.tsx tally-bridge/src/index.ts tally-bridge/src/snapshot.ts tally-bridge/src/tally-client.ts
          git commit -m "chore: format CI-blocking files [format-bot]"
          git push
