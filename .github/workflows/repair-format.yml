name: Repair formatting and verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Repair known dashboard syntax error
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/routes/_app.dashboard.tsx")
          text = path.read_text()
          broken = '''    queryKey: ["dash-employees"],
    queryFn: async () => {
      const { count, error } = await supabase.from("employees").select("id", { count: "exact", head: true }).eq("is_active", true);
      if (error) throw error;
      return count ?? 0;
    },
  });'''
          fixed = '''  const { data: employees } = useQuery({
    queryKey: ["dash-employees"],
    queryFn: async () => {
      const { count, error } = await supabase.from("employees").select("id", { count: "exact", head: true }).eq("is_active", true);
      if (error) throw error;
      return count ?? 0;
    },
  });'''
          if text.count(broken) != 1:
              raise SystemExit("Expected dashboard syntax block was not found exactly once")
          path.write_text(text.replace(broken, fixed, 1))
          PY
      - name: Apply repository formatting
        run: bun run format
      - name: Verify lint
        run: bun run lint
      - name: Verify tests
        run: bun run test
      - name: Verify build
        run: bun run build
      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair syntax and format repository"
          git push
