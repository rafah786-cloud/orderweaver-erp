name: One-time CI repair

on: push

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair dashboard syntax
        run: >-
          python3 -c 'from pathlib import Path; p=Path("src/routes/_app.dashboard.tsx"); s=p.read_text(); q=chr(34); old="    queryKey: ["+q+"dash-employees"+q+"],"; new="  const { data: employees } = useQuery({"+chr(10)+"    queryKey: ["+q+"dash-employees"+q+"],"; assert s.count(old)==1, "dashboard marker not found exactly once"; p.write_text(s.replace(old,new,1))'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format repository
        run: bun run format
      - name: Verify lint
        run: bun run lint
      - name: Verify tests
        run: bun run test
      - name: Verify build
        run: bun run build
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: repair dashboard and format code"
            git push
          fi
